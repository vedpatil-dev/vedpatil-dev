<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 28" width="100%" height="28">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#090b10" stop-opacity="0" />
      <stop offset="25%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#090b10" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="pulseOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Gradient Line -->
  <rect x="60" y="13.25" width="1080" height="1.5" fill="url(#divGrad)" />

  <!-- Center Diamond Node -->
  <polygon points="600,6 608,14 600,22 592,14" fill="#090b10" stroke="#334155" stroke-width="1.5" />
  <circle cx="600" cy="14" r="2.5" fill="#38bdf8">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
  </circle>

  <!-- Animated Scanning Light Pulse Left-to-Right -->
  <circle cx="200" cy="14" r="9" fill="url(#pulseOrb)">
    <animate attributeName="cx" values="140;1060;140" dur="6s" repeatCount="indefinite" />
  </circle>
</svg>
