<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a0f" />
      <stop offset="100%" stop-color="#0d1017" />
    </linearGradient>
    <linearGradient id="barBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="barCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <linearGradient id="barGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="barAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <style>
      .mono {
        font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        font-size: 13px;
      }
      .sans {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes revealLine {
        0% { opacity: 0; transform: translateX(-6px); }
        100% { opacity: 1; transform: translateX(0); }
      }
      @keyframes pulseGlow {
        0%, 100% { stroke-opacity: 0.5; }
        50% { stroke-opacity: 0.95; }
      }
      .line-1 { opacity: 0; animation: revealLine 0.4s ease forwards 0.2s; }
      .line-2 { opacity: 0; animation: revealLine 0.4s ease forwards 0.6s; }
      .line-3 { opacity: 0; animation: revealLine 0.4s ease forwards 1.0s; }
      .line-6 { opacity: 0; animation: revealLine 0.4s ease forwards 1.8s; }
      .line-7 { opacity: 0; animation: revealLine 0.4s ease forwards 2.2s; }
      .line-9 { opacity: 0; animation: revealLine 0.4s ease forwards 2.8s; }
      .cursor { animation: blink 1s step-end infinite; }
      .border-glow { animation: pulseGlow 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Outer Window Frame -->
  <rect x="2" y="2" width="996" height="366" rx="14" fill="url(#termBg)" stroke="#1e293b" stroke-width="1.5" class="border-glow" />

  <!-- Window Title Bar -->
  <path d="M 2 16 Q 2 2 16 2 L 984 2 Q 998 2 998 16 L 998 42 L 2 42 Z" fill="#06070b" />
  <line x1="2" y1="42" x2="998" y2="42" stroke="#1e293b" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="24" cy="22" r="6" fill="#ef4444" />
  <circle cx="44" cy="22" r="6" fill="#f59e0b" />
  <circle cx="64" cy="22" r="6" fill="#10b981" />

  <!-- Terminal Icon + Title -->
  <g transform="translate(415, 13)">
    <rect x="0" y="2" width="16" height="13" rx="2" fill="none" stroke="#64748b" stroke-width="1.5" />
    <path d="M 4 6 L 7 8.5 L 4 11 M 8 11 L 12 11" fill="none" stroke="#38bdf8" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="24" y="13" class="mono" fill="#64748b" font-size="12.5" font-weight="600">
      ved@vedpatil-dev: ~/system-profile
    </text>
  </g>

  <!-- Right Live Telemetry Indicator -->
  <circle cx="912" cy="22" r="4" fill="#10b981">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
  </circle>
  <text x="924" y="26" class="mono" fill="#10b981" font-size="11.5" font-weight="600">ONLINE</text>

  <!-- Vertical Split Divider -->
  <line x1="605" y1="56" x2="605" y2="348" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />

  <!-- LEFT PANEL: Interactive Command Output -->
  <g transform="translate(24, 72)" class="mono">
    <!-- Command 1 -->
    <g transform="translate(0, 0)">
      <g class="line-1">
        <text x="0" y="0" fill="#10b981" font-weight="700">ved@vedpatil-dev</text>
        <text x="135" y="0" fill="#38bdf8" font-weight="700">:~$</text>
        <text x="168" y="0" fill="#e2e8f0">cat profile.yaml</text>
      </g>
    </g>

    <!-- YAML Output -->
    <g transform="translate(0, 26)">
      <g class="line-2">
        <text x="8" y="0" fill="#60a5fa">engineer:</text>
        <text x="105" y="0" fill="#34d399">"Ved Patil"</text>
        <text x="8" y="22" fill="#60a5fa">core_stack:</text>
        <text x="105" y="22" fill="#fbbf24">["Java", "JavaScript", "TypeScript", "Spring", "React"]</text>
      </g>
    </g>

    <g transform="translate(0, 70)">
      <g class="line-3">
        <text x="8" y="0" fill="#60a5fa">focus_areas:</text>
        <text x="18" y="22" fill="#38bdf8">-</text>
        <text x="32" y="22" fill="#cbd5e1">Full-stack web engineering &amp; distributed backend systems</text>
        <text x="18" y="44" fill="#38bdf8">-</text>
        <text x="32" y="44" fill="#cbd5e1">Software architecture, system design &amp; DevOps automation</text>
        <text x="18" y="66" fill="#38bdf8">-</text>
        <text x="32" y="66" fill="#cbd5e1">High-performance, maintainable production applications</text>
        <text x="18" y="88" fill="#38bdf8">-</text>
        <text x="32" y="88" fill="#cbd5e1">Relational/NoSQL data modeling &amp; cloud infrastructure</text>
      </g>
    </g>

    <!-- Command 2 -->
    <g transform="translate(0, 188)">
      <g class="line-6">
        <text x="0" y="0" fill="#10b981" font-weight="700">ved@vedpatil-dev</text>
        <text x="135" y="0" fill="#38bdf8" font-weight="700">:~$</text>
        <text x="168" y="0" fill="#e2e8f0">./verify-environment.sh</text>
      </g>
    </g>

    <g transform="translate(8, 214)">
      <g class="line-7">
        <!-- SVG Checkmark Icon 1 -->
        <path d="M 2 -8 L 6 -4 L 14 -12" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        <text x="22" y="0" fill="#34d399" font-weight="600">Primary Stack:</text>
        <text x="142" y="0" fill="#94a3b8">Java • JS/TS • Spring Boot • React • Next.js</text>

        <!-- SVG Checkmark Icon 2 -->
        <path d="M 2 14 L 6 18 L 14 10" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        <text x="22" y="22" fill="#34d399" font-weight="600">Collaboration:</text>
        <text x="142" y="22" fill="#94a3b8">Available for engineering &amp; open-source projects</text>
      </g>
    </g>

    <!-- Active Prompt with Blinking Cursor -->
    <g transform="translate(0, 268)">
      <g class="line-9">
        <text x="0" y="0" fill="#10b981" font-weight="700">ved@vedpatil-dev</text>
        <text x="135" y="0" fill="#38bdf8" font-weight="700">:~$</text>
        <text x="168" y="0" fill="#cbd5e1">npm run build &amp;&amp; mvn spring-boot:run</text>
        <rect x="456" y="-13" width="9" height="16" fill="#38bdf8" class="cursor" />
      </g>
    </g>
  </g>

  <!-- RIGHT PANEL: Engineering Telemetry & Metrics -->
  <g transform="translate(630, 72)" class="mono">
    <!-- Vector Pulse Icon -->
    <path d="M 0 -4 L 5 -4 L 8 -11 L 13 3 L 16 -4 L 22 -4" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <text x="30" y="0" fill="#e2e8f0" font-weight="700" font-size="13">ENGINEERING TELEMETRY</text>
    <line x1="0" y1="10" x2="340" y2="10" stroke="#1e293b" stroke-width="1" />

    <!-- Metric 1 -->
    <g transform="translate(0, 36)">
      <text x="0" y="0" fill="#e2e8f0" font-size="12">Java, JS/TS &amp; Full-Stack Architecture</text>
      <text x="340" y="0" text-anchor="end" fill="#60a5fa" font-size="12" font-weight="700">96%</text>
      <rect x="0" y="8" width="340" height="8" rx="4" fill="#131822" />
      <rect x="0" y="8" width="326" height="8" rx="4" fill="url(#barBlue)">
        <animate attributeName="width" from="0" to="326" dur="1.4s" fill="freeze" />
      </rect>
    </g>

    <!-- Metric 2 -->
    <g transform="translate(0, 82)">
      <text x="0" y="0" fill="#e2e8f0" font-size="12">React, Next.js &amp; Frontend Systems</text>
      <text x="340" y="0" text-anchor="end" fill="#38bdf8" font-size="12" font-weight="700">95%</text>
      <rect x="0" y="8" width="340" height="8" rx="4" fill="#131822" />
      <rect x="0" y="8" width="323" height="8" rx="4" fill="url(#barCyan)">
        <animate attributeName="width" from="0" to="323" dur="1.6s" fill="freeze" />
      </rect>
    </g>

    <!-- Metric 3 -->
    <g transform="translate(0, 128)">
      <text x="0" y="0" fill="#e2e8f0" font-size="12">Spring Boot, Node.js &amp; Data Layer</text>
      <text x="340" y="0" text-anchor="end" fill="#34d399" font-size="12" font-weight="700">94%</text>
      <rect x="0" y="8" width="340" height="8" rx="4" fill="#131822" />
      <rect x="0" y="8" width="319" height="8" rx="4" fill="url(#barGreen)">
        <animate attributeName="width" from="0" to="319" dur="1.8s" fill="freeze" />
      </rect>
    </g>

    <!-- Metric 4 -->
    <g transform="translate(0, 174)">
      <text x="0" y="0" fill="#e2e8f0" font-size="12">Cloud Infrastructure, CI/CD &amp; Linux</text>
      <text x="340" y="0" text-anchor="end" fill="#fbbf24" font-size="12" font-weight="700">90%</text>
      <rect x="0" y="8" width="340" height="8" rx="4" fill="#131822" />
      <rect x="0" y="8" width="306" height="8" rx="4" fill="url(#barAmber)">
        <animate attributeName="width" from="0" to="306" dur="2.0s" fill="freeze" />
      </rect>
    </g>

    <!-- Bottom Mini Info Box -->
    <g transform="translate(0, 214)">
      <rect x="0" y="0" width="340" height="60" rx="8" fill="#06070b" stroke="#1e293b" stroke-width="1" />
      <text x="14" y="23" fill="#38bdf8" font-size="11.5" font-weight="700">PRIMARY LANGUAGES: Java • JavaScript • TypeScript</text>
      <text x="14" y="43" fill="#94a3b8" font-size="11.5">Spring Boot • React • Next.js • Node.js • Postgres</text>
    </g>
  </g>
</svg>
